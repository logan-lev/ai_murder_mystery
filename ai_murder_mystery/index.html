<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dead Orbit</title>
  </head>
  <body>
    <main id="app">
      <header id="header">
        <h1>Dead Orbit</h1>
        <p id="case-number"></p>
      </header>

      <p id="status">Checking your GPU...</p>
      <progress id="progress" max="1" value="0"></progress>

      <nav id="suspect-tabs"></nav>

      <div id="chat-log"></div>

      <form id="chat-form">
        <input id="chat-input" type="text" placeholder="Choose a crew member to question..." autocomplete="off" disabled />
        <button id="send-btn" type="submit" disabled>Ask</button>
      </form>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
